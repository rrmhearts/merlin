# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        chmod +x ./install*.sh ./tools/*.sh
        sudo apt install gcc g++ make zip unzip autotools-dev cmake csh libtool -y
        sudo apt install build-essential pkg-config libncurses5-dev libncursesw5-dev -y
        sudo apt install libx11-dev libsndfile1-dev libcurses-ocaml libxml2-dev libxslt-dev -y

    - name: Run install.sh script
      run: |
        ./install.sh
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Test by running the demo
      run: |
        cd egs/build_your_own_voice/s1_python
        python run_merlin_workflow.py --setup-data --train-tts --run-tts

